name: Publish HDR Fix v2.0.2

on:
  push:
    branches:
      - main
    paths:
      - ".release-payload/v2.0.2*"
      - "README.md"
      - "HASHES.md"
      - "docs/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated payloads
        shell: pwsh
        run: |
          $releasePayload = ".release-payload/v2.0.2.zip"
          $sourcePayload = ".release-payload/v2.0.2-sources.zip"

          if (-not (Test-Path $releasePayload)) { throw "Validated v2.0.2 release payload missing" }
          if (-not (Test-Path $sourcePayload)) { throw "Validated v2.0.2 source payload missing" }

          $expectedRelease = "179468f462354c0319a96ef4b69a66b758b72c34a57dddbc93585708cdb04979"
          $actualRelease = (Get-FileHash $releasePayload -Algorithm SHA256).Hash.ToLower()
          if ($actualRelease -ne $expectedRelease) {
            throw "Release payload hash mismatch. Expected $expectedRelease, found $actualRelease"
          }

          $expectedSource = "42c70f02343d55183ebd219c010412d0c5043b02b30d6c78dff9f54addca4917"
          $actualSource = (Get-FileHash $sourcePayload -Algorithm SHA256).Hash.ToLower()
          if ($actualSource -ne $expectedSource) {
            throw "Source payload hash mismatch. Expected $expectedSource, found $actualSource"
          }

      - name: Publish V20 source into repository
        shell: pwsh
        run: |
          if (Test-Path Source) { Remove-Item Source -Recurse -Force }
          New-Item -ItemType Directory -Force Source | Out-Null
          Expand-Archive ".release-payload/v2.0.2-sources.zip" -DestinationPath Source -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source

          if (-not (git diff --cached --quiet)) {
            git commit -m "Add validated V20 source [skip ci]"
            git push origin HEAD:main
          }

          $sourceCommit = (git rev-parse HEAD).Trim()
          "SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare exact validated release
        shell: pwsh
        run: |
          $zip = "Gori_Cuddly_Carnage_HDR_Fix_v2.0.2.zip"
          Copy-Item ".release-payload/v2.0.2.zip" $zip -Force

          $expected = "179468f462354c0319a96ef4b69a66b758b72c34a57dddbc93585708cdb04979"
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "Final release ZIP mismatch. Expected $expected, found $actual"
          }

          if (Test-Path verify) { Remove-Item verify -Recurse -Force }
          Expand-Archive $zip -DestinationPath verify -Force

          $asi = (Get-FileHash "verify/GoriHDRFix.asi" -Algorithm SHA256).Hash.ToLower()
          $dxgi = (Get-FileHash "verify/dxgi.dll" -Algorithm SHA256).Hash.ToLower()

          if ($asi -ne "e95c90d48c49e4ef94b5f7ad12c95524025add9dab5ba4a7cf2be57768e008c7") {
            throw "ASI hash mismatch"
          }
          if ($dxgi -ne "89487954807a1751321f0392cd36a1819e5db4e9fb5c721da5a0e0ef72f1d0cf") {
            throw "DXGI hash mismatch"
          }

          @(
            "$asi  GoriHDRFix.asi"
            "$dxgi  dxgi.dll"
            "$actual  $zip"
          ) | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Create or update v2.0.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.0.2"
          $zip = "Gori_Cuddly_Carnage_HDR_Fix_v2.0.2.zip"

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip SHA256SUMS.txt --clobber
            gh release edit $tag --title "Gori HDR Fix v2.0.2" --notes-file "docs/RELEASE_NOTES_v2.0.2.md"
          } else {
            gh release create $tag $zip SHA256SUMS.txt --target "$env:SOURCE_COMMIT" --title "Gori HDR Fix v2.0.2" --notes-file "docs/RELEASE_NOTES_v2.0.2.md"
          }
