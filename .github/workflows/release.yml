name: Publish HDR Fix v2.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".release-payload/**"
      - "README.md"
      - "HASHES.md"
      - "docs/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct validated v2.0.0 package
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".release-payload/v2.0.0.part*.b64" | Sort-Object Name
          if (-not $parts) { throw "v2.0.0 release payload parts not found" }

          $base64 = ""
          foreach ($part in $parts) {
            $base64 += (Get-Content $part.FullName -Raw).Trim()
          }

          $bytes = [Convert]::FromBase64String($base64)
          $zip = "Gori_Cuddly_Carnage_HDR_Fix_v2.0.0.zip"
          [IO.File]::WriteAllBytes($zip, $bytes)

          $expected = "2ef4c8abf2fca83511632d4482abe174a59c1268646b56dac5e0687f254e0b94"
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "Release payload hash mismatch. Expected $expected, found $actual"
          }

          "$actual  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Create or update v2.0.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.0.0"
          $zip = "Gori_Cuddly_Carnage_HDR_Fix_v2.0.0.zip"

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip SHA256SUMS.txt --clobber
            gh release edit $tag --title "Gori HDR Fix v2.0.0" --notes-file "docs/RELEASE_NOTES_v2.0.0.md"
          } else {
            gh release create $tag $zip SHA256SUMS.txt --target "${{ github.sha }}" --title "Gori HDR Fix v2.0.0" --notes-file "docs/RELEASE_NOTES_v2.0.0.md"
          }

      - name: Remove obsolete EXE patcher release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "v1.0.0" 2>$null) {
            gh release delete "v1.0.0" --yes --cleanup-tag
          }
